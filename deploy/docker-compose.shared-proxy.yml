# Production behind a reverse proxy that already owns ports 80/443 on this host
# (e.g. another app's Caddy). Same as docker-compose.prod.yml, without Caddy.
# The web/API container joins the proxy's docker network under the alias
# `supportx-server`; the proxy forwards the domain to supportx-server:3000
# (example site file: deploy/caddy-sites/supportx.caddy). Database and worker
# stay on SupportX's own network only.
# Run from the repository root:
#   docker compose -f deploy/docker-compose.shared-proxy.yml --env-file .env up -d --build
# Needs in .env: POSTGRES_PASSWORD, APP_ENCRYPTION_KEY, PUBLIC_BASE_URL=https://<domain>,
# SECURE_COOKIES=true; optional PROXY_NETWORK (default tradex_edge), which must exist.
name: supportx
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: supportx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: supportx
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supportx"]
      interval: 5s
      retries: 10

  server:
    build: ..
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: postgres://supportx:${POSTGRES_PASSWORD}@db:5432/supportx
      HOST: 0.0.0.0
      PORT: "3000"
    volumes:
      - ../theme:/app/theme:ro
    networks:
      # default: database and internet egress (Microsoft, Amazon, weclapp, AI).
      default: {}
      proxy:
        aliases: [supportx-server]
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: ..
    restart: unless-stopped
    command: ["node", "--import", "tsx", "apps/worker/main.ts"]
    env_file: ../.env
    environment:
      DATABASE_URL: postgres://supportx:${POSTGRES_PASSWORD}@db:5432/supportx
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:

networks:
  proxy:
    name: ${PROXY_NETWORK:-tradex_edge}
    external: true
