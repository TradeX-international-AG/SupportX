# Test instance next to the live installation on the same server (deploy/test-instance.sh).
# Own project name, own database (a copy of the live one), web/API only:
# no worker (no mailbox sync, no outbox dispatch, no automation), no Caddy,
# sending switched off. Reachable only on 127.0.0.1:3100, i.e. through an SSH tunnel.
name: supportx-test
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: supportx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: supportx
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supportx"]
      interval: 5s
      retries: 10

  server:
    build: ..
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: postgres://supportx:${POSTGRES_PASSWORD}@db:5432/supportx
      HOST: 0.0.0.0
      PORT: "3000"
      SEND_MODE: drafts_only
      PUBLIC_BASE_URL: http://localhost:3100
      SECURE_COOKIES: "false"
    ports:
      - "127.0.0.1:3100:3000"
    volumes:
      - ../theme:/app/theme:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
